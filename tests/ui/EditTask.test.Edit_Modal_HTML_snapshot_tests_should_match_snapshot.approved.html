<form class="tasks-modal">
  <section class="tasks-modal-description-section">
    <label for="description">
      Descrip
      <span class="accesskey">t</span>
      ion
    </label>
    <textarea
      id="description"
      class="tasks-modal-description"
      placeholder="Take out the trash"
      accesskey="t"></textarea>
  </section>
  <!---->
  <!---->
  <section class="tasks-modal-priority-section">
    <label id="priority" for="priority-none">Priority</label>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-highest" accesskey="i" value="highest" />
      <label for="priority-highest">
        <span class="tasks-priority-label">
          <span>H</span>
          <span class="accesskey">i</span>
          <span>ghest</span>
          <!---->
        </span>
        <span class="tasks-priority-emoji">🔺</span>
        <!---->
      </label>
    </div>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-high" accesskey="h" value="high" />
      <label for="priority-high">
        <span class="tasks-priority-label">
          <span></span>
          <span class="accesskey">H</span>
          <span>igh</span>
          <!---->
        </span>
        <span class="tasks-priority-emoji">⏫</span>
        <!---->
      </label>
    </div>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-medium" accesskey="m" value="medium" />
      <label for="priority-medium">
        <span class="tasks-priority-label">
          <span></span>
          <span class="accesskey">M</span>
          <span>edium</span>
          <!---->
        </span>
        <span class="tasks-priority-emoji">🔼</span>
        <!---->
      </label>
    </div>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-none" accesskey="n" value="none" />
      <label for="priority-none">
        <span class="tasks-priority-label">
          <span></span>
          <span class="accesskey">N</span>
          <span>ormal</span>
          <!---->
        </span>
        <!---->
      </label>
    </div>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-low" accesskey="l" value="low" />
      <label for="priority-low">
        <span class="tasks-priority-label">
          <span></span>
          <span class="accesskey">L</span>
          <span>ow</span>
          <!---->
        </span>
        <span class="tasks-priority-emoji">🔽</span>
        <!---->
      </label>
    </div>
    <div class="task-modal-priority-option-container">
      <input type="radio" id="priority-lowest" accesskey="o" value="lowest" />
      <label for="priority-lowest">
        <span class="tasks-priority-label">
          <span>L</span>
          <span class="accesskey">o</span>
          <span>west</span>
          <!---->
        </span>
        <span class="tasks-priority-emoji">⏬</span>
        <!---->
      </label>
    </div>
    <!---->
    <!---->
  </section>
  <hr />
  <!---->
  <!---->
  <section class="tasks-modal-dates-section">
    <!---->
    <!---->
    <label for="recurrence">
      <span class="accesskey">R</span>
      ecurs
    </label>
    <input id="recurrence" type="text" placeholder="e.g. every week" class="tasks-modal-date-input" accesskey="r" />
    <span class="tasks-modal-parsed-date tasks-modal-parsed-message">
      🔁
      <!---->
      <i>not recurring</i>
      <!---->
    </span>
    <!---->
    <!---->
    <label for="due">
      <span class="accesskey">D</span>
      ue
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="due"
      class="tasks-modal-date-input"
      accesskey="d" />
    <div class="tasks-modal-parsed-date tasks-show-emoji">
      📅
      <input
        class="tasks-modal-date-editor-picker"
        type="date"
        tabindex="-1"
        id="date-editor-picker-due"
        aria-label="Pick Due date" />
    </div>
    <!---->
    <!---->
    <!---->
    <label for="scheduled">
      <span class="accesskey">S</span>
      cheduled
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="scheduled"
      class="tasks-modal-date-input tasks-modal-error"
      accesskey="s" />
    <span class="tasks-modal-parsed-date tasks-modal-parsed-message">
      ⏳
      <i>invalid scheduled date</i>
      <!---->
    </span>
    <!---->
    <!---->
    <!---->
    <label for="start">
      St
      <span class="accesskey">a</span>
      rt
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="start"
      class="tasks-modal-date-input"
      accesskey="a" />
    <div class="tasks-modal-parsed-date tasks-show-emoji">
      🛫
      <input
        class="tasks-modal-date-editor-picker"
        type="date"
        tabindex="-1"
        id="date-editor-picker-start"
        aria-label="Pick Start date" />
    </div>
    <!---->
    <!---->
    <div class="future-dates-only" id="only-future-dates">
      <label for="forwardOnly">
        Only
        <span class="accesskey">f</span>
        uture dates:
      </label>
      <input id="forwardOnly" type="checkbox" class="task-list-item-checkbox tasks-modal-checkbox" accesskey="f" />
    </div>
    <!---->
  </section>
  <hr />
  <!---->
  <!---->
  <section class="tasks-modal-dependencies-section">
    <!---->
    <!---->
    <!---->
    <label for="before_this">
      <span class="accesskey">B</span>
      locked by
    </label>
    <span>
      <input
        class="tasks-modal-dependency-input"
        type="text"
        accesskey="b"
        id="before_this"
        placeholder="Search tasks that must be done first…" />
    </span>
    <!---->
    <!---->
    <!---->
    <!---->
    <label for="after_this">
      Bloc
      <span class="accesskey">k</span>
      s
    </label>
    <span>
      <input
        class="tasks-modal-dependency-input"
        type="text"
        accesskey="k"
        id="after_this"
        placeholder="Search tasks waiting on this one…" />
    </span>
    <!---->
    <!---->
    <!---->
  </section>
  <hr />
  <!---->
  <!---->
  <section class="tasks-modal-dates-section">
    <!---->
    <!---->
    <label for="status-type" id="status">
      Stat
      <span class="accesskey">u</span>
      s
    </label>
    <select id="status-type" class="status-editor-status-selector" accesskey="u">
      <option value=" ">Todo [ ]</option>
      <option value="/">In Progress [/]</option>
      <option value="x">Done [x]</option>
      <option value="-">Cancelled [-]</option>
    </select>
    <!---->
    <!---->
    <label for="created">
      <span class="accesskey">C</span>
      reated
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="created"
      class="tasks-modal-date-input"
      accesskey="c" />
    <div class="tasks-modal-parsed-date tasks-show-emoji">
      ➕
      <input
        class="tasks-modal-date-editor-picker"
        type="date"
        tabindex="-1"
        id="date-editor-picker-created"
        aria-label="Pick Created date" />
    </div>
    <!---->
    <!---->
    <!---->
    <label for="done">
      Done (
      <span class="accesskey">x</span>
      )
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="done"
      class="tasks-modal-date-input"
      accesskey="x" />
    <div class="tasks-modal-parsed-date tasks-show-emoji">
      ✅
      <input
        class="tasks-modal-date-editor-picker"
        type="date"
        tabindex="-1"
        id="date-editor-picker-done"
        aria-label="Pick Done date" />
    </div>
    <!---->
    <!---->
    <!---->
    <label for="cancelled">
      Cancelled (
      <span class="accesskey">-</span>
      )
    </label>
    <input
      type="text"
      placeholder="Try 'Mon' or 'tm' then space"
      id="cancelled"
      class="tasks-modal-date-input"
      accesskey="-" />
    <div class="tasks-modal-parsed-date tasks-show-emoji">
      ❌
      <input
        class="tasks-modal-date-editor-picker"
        type="date"
        tabindex="-1"
        id="date-editor-picker-cancelled"
        aria-label="Pick Cancelled date" />
    </div>
    <!---->
  </section>
  <!---->
  <!---->
  <section class="tasks-modal-button-section">
    <button type="submit" class="mod-cta" disabled="">Apply</button>
    <button type="button">Cancel</button>
  </section>
</form>
